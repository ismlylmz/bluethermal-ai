name: Daily update

on:
  schedule:
    - cron: "15 12 * * *"   # 12:15 UTC, after Nord Pool day-ahead prices are published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        run: python pipeline/run_daily.py
      - name: Commit data and dashboard
        run: |
          git config user.name "bluethermal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
